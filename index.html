
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống giám sát bể nuôi</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #263445;
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 8px;
        }

        .status {
            text-align: center;
            margin-bottom: 25px;
            color: #b45309;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px #00000012;
        }

            .card h2 {
                font-size: 20px;
                color: #526477;
            }

        .value {
            font-size: 36px;
            font-weight: bold;
            color: #0878c9;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        button {
            padding: 13px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .pump {
            background: #159447;
        }

        .valve {
            background: #dc3545;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 700px) {
            .cards, .charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>HỆ THỐNG GIÁM SÁT BỂ NUÔI</h1>
        <div class="status" id="connection">Đang kết nối MQTT...</div>

        <div class="cards">
            <div class="card">
                <h2>Mực nước trong bể</h2>
                <div class="value" id="waterLevel">-- m</div>
            </div>

            <div class="card">
                <h2>Nhiệt độ nước</h2>
                <div class="value" id="temperature">-- °C</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-box">
                <h3>Biểu đồ mực nước</h3>
                <canvas id="waterChart"></canvas>
            </div>

            <div class="chart-box">
                <h3>Biểu đồ nhiệt độ</h3>
                <canvas id="tempChart"></canvas>
            </div>
        </div>

        <div class="controls">
            <h2>ĐIỀU KHIỂN THIẾT BỊ</h2>
            <button class="pump" onclick="controlDevice('pump')">
                BẬT / TẮT MÁY BƠM
            </button>

            <button class="valve" onclick="controlDevice('valve')">
                BẬT / TẮT VAN XẢ
            </button>
        </div>

    </div>

    <script>const broker = "wss://broker.emqx.io:8084/mqtt";

    const topicData = "emqx/utc2026/telemetry";
    const topicControl = "emqx/utc2026/control";

    const connection = document.getElementById("connection");

    const client = mqtt.connect(broker);

    client.on("connect", function () {
        connection.innerText = "Đã kết nối MQTT";
        connection.style.color = "green";

        client.subscribe(topicData);
    });

    client.on("error", function (error) {
        connection.innerText = "Lỗi kết nối MQTT";
        connection.style.color = "red";
        console.log(error);
    });

    const labels = [];

    const waterChart = new Chart(
        document.getElementById("waterChart"),
        {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Mực nước (m)",
                    data: [],
                    borderColor: "#0878c9",
                    tension: 0.3
                }]
            }
        }
    );

    const tempChart = new Chart(
        document.getElementById("tempChart"),
        {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Nhiệt độ (°C)",
                    data: [],
                    borderColor: "#e05252",
                    tension: 0.3
                }]
            }
        }
    );

    client.on("message", function (topic, message) {
        try {
            const data = JSON.parse(message.toString());

            let water = data.waterLevel ?? data.level;
            let temp = data.temperature ?? data.temp;

            if (water === undefined && data.distance !== undefined) {
                water = (200 - Number(data.distance)) / 100;
            }

            if (water !== undefined) {
                document.getElementById("waterLevel").innerText =
                    Number(water).toFixed(2) + " m";
            }

            if (temp !== undefined) {
                document.getElementById("temperature").innerText =
                    Number(temp).toFixed(2) + " °C";
            }

            if (water !== undefined && temp !== undefined) {
                const time = new Date().toLocaleTimeString();

                labels.push(time);
                waterChart.data.labels.push(time);
                waterChart.data.datasets[0].data.push(Number(water));

                tempChart.data.labels.push(time);
                tempChart.data.datasets[0].data.push(Number(temp));

                if (labels.length > 20) {
                    labels.shift();
                    waterChart.data.labels.shift();
                    waterChart.data.datasets[0].data.shift();
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }

                waterChart.update();
                tempChart.update();
            }

        } catch (error) {
            console.log("Lỗi đọc dữ liệu:", error);
        }
    });

    let pumpState = false;
    let valveState = false;

        function controlDevice(device) {
            if (device === "pump") {
                pumpState = !pumpState;
                if (pumpState) valveState = false;
            } else {
                valveState = !valveState;
                if (valveState) pumpState = false;
            }

            const command = {
                pump: pumpState,
                valve: valveState
            };

            client.publish(topicControl, JSON.stringify(command));

            console.log("Da gui lenh:", command);
        }
    </script>

</body>
</html>
